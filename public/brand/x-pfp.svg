<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#142c44"/>
      <stop offset="60%" stop-color="#0b1724"/>
      <stop offset="100%" stop-color="#050a10"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="moonFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="starFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)"/>

  <!-- Radial Core Glow -->
  <circle cx="500" cy="500" r="420" fill="url(#coreGlow)"/>

  <!-- Subtle Circular Boundary (Within safe crop zone) -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 12"/>
  <circle cx="500" cy="500" r="420" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Central Nightshift Moon Logo (Scaled and centered at 500,500) -->
  <!-- Original viewBox is 24x24. Bounding box of moon+star is roughly (2.5, 3) to (20.5, 21.5), width 18, height 18.5 -->
  <!-- Scale 26x translates (12, 12) to (500, 500) -->
  <g transform="translate(500, 505) scale(26) translate(-12.5, -12.5)" filter="url(#bloom)">
    <!-- Moon Path -->
    <path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"
          fill="url(#moonFill)"
          stroke="url(#moonStroke)"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Star Path -->
    <path d="m17 3 .5 1.5L19 5l-1.5.5L17 7l-.5-1.5L15 5l1.5-.5Z"
          fill="url(#starFill)"
          filter="url(#subtleGlow)"/>
  </g>
</svg>
